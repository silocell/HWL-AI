     if(t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); }catch(e){}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#f7f7f4;--card:#ffffff;--ink:#16181d;--soft:#5b6170;--faint:#8a8f9c;--rule:#e3e3dc;--accent:#0b63ce;--accent-soft:#e6f0fc;--hl:#ffe9a8;--codebg:#f1f2f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#181b21;--ink:#ecedf0;--soft:#a3a8b4;--faint:#767c89;--rule:#2a2e37;--accent:#6aa8f5;--accent-soft:#16243a;--hl:#4a3d12;--codebg:#12151a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#181b21;--ink:#ecedf0;--soft:#a3a8b4;--faint:#767c89;--rule:#2a2e37;--accent:#6aa8f5;--accent-soft:#16243a;--hl:#4a3d12;--codebg:#12151a;color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px}
.top .sp{flex:1}
.top a{font-size:.88rem;text-decoration:none;color:var(--soft)}
.top a:hover{color:var(--ink)}
.word{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.04em;text-decoration:none;color:var(--ink)}
.word .q{color:var(--accent)}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:0 20px 40px}
/* the empty page: one big question box, like a search engine */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62vh;text-align:center;gap:18px}
.home .word{font-size:clamp(3rem,10vw,5.2rem);line-height:1}
.home p{margin:0;color:var(--soft);max-width:30rem}
.ask{width:100%;display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1.5px solid var(--rule);border-radius:26px;padding:8px 8px 8px 20px;box-shadow:0 10px 30px -22px rgba(0,0,0,.45)}
.ask:focus-within{border-color:var(--accent)}
.ask textarea{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;resize:none;padding:9px 0;max-height:180px;min-height:24px}
.ask button{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1.15rem;cursor:pointer}
.ask button:disabled{opacity:.4;cursor:default}
.ask button:focus-visible,.chips button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.fine{font-size:.78rem;color:var(--faint);text-align:center;margin:10px auto 0;max-width:34rem}
/* answers */
.qa{padding:26px 0 8px;border-bottom:1px solid var(--rule)}
.qa h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:1.55rem;letter-spacing:-.02em;line-height:1.25;margin:0 0 14px}
.status{color:var(--soft);font-size:.92rem;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.srcs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.srcs a{flex:none;width:190px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:9px 11px;font-size:.82rem}
.srcs a:hover{border-color:var(--accent)}
.srcs b{color:var(--accent);font-size:.75rem}
.srcs span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.srcs small{color:var(--faint)}
.body p{margin:0 0 .8em}
.body h1,.body h2,.body h3{font-size:1.08rem;margin:1.1em 0 .4em}
.body ul,.body ol{padding-left:1.3em;margin:0 0 .8em}
.body code{background:var(--codebg);padding:1px 5px;border-radius:5px;font-size:.9em}
.body table{border-collapse:collapse;margin:0 0 .8em;font-size:.92rem;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--rule);padding:5px 9px;text-align:left}
.code{background:var(--codebg);border:1px solid var(--rule);border-radius:10px;margin:0 0 .8em;overflow:hidden}
.code header{font-size:.75rem;color:var(--faint);padding:4px 12px;border-bottom:1px solid var(--rule)}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font-size:.86rem}
.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin:0 1px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:.7rem;font-weight:700;text-decoration:none;vertical-align:2px}
.err{color:#c0392b}
.meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--faint);margin:6px 0 4px}
.meta a{color:var(--soft)}
.follow{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:22px 0 14px}
.gate{text-align:center;padding:40px 0}
.gate a,.gate button{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 20px;border:0;border-radius:999px;font:600 1rem inherit;margin-top:10px;cursor:pointer}
.gate .sso{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:16px auto 0}
.gate .sso button.alt{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.85}
.gate form{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;margin:4px auto 6px;text-align:left}
.gate form input,.gate form button{width:100%}
.gate input{padding:10px 12px;border-radius:12px;border:1.5px solid rgba(127,127,127,.4);background:transparent;color:inherit;font:1rem inherit}
.gate .err{color:#e5484d;min-height:1.2em;font-size:.9rem;margin:2px 0 0}
@media (max-width:560px){.top{padding:10px 16px} main{padding:0 16px 30px} .qa h2{font-size:1.3rem} .home{min-height:55vh}}
</style>
</head>
<body>
<div class="top"><a class="word" href="./" style="font-size:1.25rem" id="logo" hidden>HWL<span class="q">AI</span></a><span class="sp"></span><span data-chausima-apps></span><a href="https://ai.civilinitiatives.org/" id="openLai" hidden>Launchpad AI</a><a href="https://civilinitiatives.org/" id="openLp" hidden>Launchpad</a></div>
<main id="main">
  <section class="home" id="home">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>

<script>
/* HWLAI: the Launchpad's own search AI, on its own page. Every question
   goes to hwchat with model "hwlai" (search the web, read the top pages,
   answer with numbered sources). Follow-ups stay in the same chat, which
   also shows up in Launchpad AI. The question is kept after the # in the
   address, so it never reaches a server log. */
(function () {
  "use strict";
  var URL_ = "https://hehs-live.duckdns.org", KEY_ = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkyODMyMjkwLCJleHAiOjIxMDgxOTIyOTB9.7gFhQa5RBwVtiOPLO7Qf2-aVEbkd5xgpLiN1J06Gybo";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var sb = null, thread = null, busy = false, signedIn = false;
  try { sb = window.supabase.createClient(URL_, KEY_, { auth: { persistSession: true, autoRefreshToken: true, storage: (window.HEHAuth && window.HEHAuth.storage) || undefined } }); } catch (e) {}
  function inline(s) {
    return s.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; })
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function mdText(p) {
    var out = "", lines = esc(p).split("\n"), list = null, para = [], i = 0;
    function fp() { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } }
    function fl() { if (list) { out += "<" + list.t + ">" + list.items.map(function (x) { return "<li>" + inline(x) + "</li>"; }).join("") + "</" + list.t + ">"; list = null; } }
    for (; i < lines.length; i++) {
      var l = lines[i], m;
      if (!l.trim()) { fp(); fl(); continue; }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf("-") >= 0) {
        fp(); fl(); var cells = function (r) { return r.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return inline(c.trim()); }); };
        var head = cells(l), body = []; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
        i--; out += "<table><thead><tr>" + head.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>" +
          body.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>"; continue;
      }
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { fp(); fl(); var lv = Math.min(4, m[1].length + 1); out += "<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"; continue; }
      if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)) { fp(); fl(); out += "<hr>"; continue; }
      if ((m = l.match(/^&gt;\s?(.*)/))) { fp(); fl(); out += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
      if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { fp(); if (!list || list.t !== "ul") { fl(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { fp(); if (!list || list.t !== "ol") { fl(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
      if (list && /^\s{2,}\S/.test(l)) { list.items[list.items.length - 1] += " " + l.trim(); continue; }
      fl(); para.push(l);
    }
    fp(); fl(); return out;
  }
  // splits text into prose and fenced blocks; an unclosed block (while typing) counts too
  function blocks(t) {
    var out = [], re = /^(`{3,})([^\n`]*)\n?/m, rest = String(t || "");
    while (rest.length) {
      var m = re.exec(rest);
      if (!m) { out.push({ t: "text", s: rest }); break; }
      if (m.index) out.push({ t: "text", s: rest.slice(0, m.index) });
      rest = rest.slice(m.index + m[0].length);
      var end = new RegExp("^`{" + m[1].length + ",}[ \\t]*$", "m").exec(rest), code = end ? rest.slice(0, end.index) : rest;
      out.push({ t: "code", info: m[2].trim(), s: code.replace(/\n$/, ""), open: !end });
      rest = end ? rest.slice(end.index + end[0].length).replace(/^\n/, "") : "";
    }
    return out;
  }
  function md(t) {
    return blocks(t).map(function (b) {
      if (b.t === "text") return mdText(b.s);
      return '<div class="code"><header><span>' + esc(b.info || "code") + '</span></header><pre><code>' + esc(b.s) + "</code></pre></div>";
    }).join("");
  }
  function srcUrl(u) { try { var x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : ""; } catch (e) { return ""; } }
  function cites(html, src) {
    if (!src || !src.length) return html;
    return html.split(/(<pre[\s\S]*?<\/pre>|<code[\s\S]*?<\/code>)/).map(function (part, k) {
      if (k % 2) return part;
      return part.replace(/\[(\d{1,2})\]/g, function (all, n) {
        var s = src[+n - 1], u = s && srcUrl(s.url); if (!u) return all;
        return '<a class="cite" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer nofollow" title="' + esc(s.title + " - " + s.site) + '">' + n + "</a>";
      });
    }).join("");
  }
  function sourcesHtml(src) {
    return '<div class="srcs" aria-label="Sources">' + src.map(function (s) { var u = srcUrl(s.url); if (!u) return "";
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer nofollow" title="' + esc(s.title) + '"><b>' + (+s.n) + "</b><span>" + esc(s.title) + "</span><small>" + esc(s.site) + "</small></a>"; }).join("") + "</div>";
  }

  ["How do volcanoes form?", "Who won the Battle of Hastings and why?", "What's the difference between weather and climate?", "Explain photosynthesis simply"].forEach(function (q) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = q; b.onclick = function () { ask(q); }; $("ideas").appendChild(b);
  });
  function grow(t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }
  [["askHome", "qHome"], ["askMore", "qMore"]].forEach(function (p) {
    var f = $(p[0]), t = $(p[1]);
    t.addEventListener("input", function () { grow(t); });
    t.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit")); } });
    f.addEventListener("submit", function (e) { e.preventDefault(); var q = t.value.trim(); if (!q) return; t.value = ""; grow(t); ask(q); });
  });
  /* not signed in: sign in right here (Chausima, Google or Microsoft); the question waits and is asked straight after */
  function gate() {
    $("home").hidden = true; $("followBox").hidden = true;
    var q = ""; try { q = new URLSearchParams(location.hash.slice(1)).get("q") || ""; if (q) sessionStorage.setItem("hwlai.q", q); } catch (e) {}
    $("log").innerHTML = '<div class="gate"><span class="word" style="font-size:3rem">HWL<span class="q">AI</span></span><p>Sign in to use HWLAI. It\'s free.</p>' +
      '<div class="sso"><button type="button" id="gChz">Sign in with Chausima</button>' +
      '<form id="gForm" hidden><input id="gEm" placeholder="name@chausima.com" autocomplete="username" autocapitalize="none" spellcheck="false" aria-label="Chausima address" required>' +
      '<input id="gPw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required><button>Sign in</button><p class="err" id="gErr" role="alert"></p></form>' +
      '<button type="button" class="alt" data-p="google">Sign in with Google</button><button type="button" class="alt" data-p="azure">Sign in with Microsoft (school)</button></div></div>';
    $("gChz").onclick = function () { $("gForm").hidden = false; this.hidden = true; $("gEm").focus(); };
    Array.prototype.forEach.call(document.querySelectorAll(".gate [data-p]"), function (b) {
      b.onclick = function () { sb.auth.signInWithOAuth({ provider: b.dataset.p, options: { redirectTo: location.origin + location.pathname, scopes: b.dataset.p === "azure" ? "email" : undefined } }); };
    });
    $("gForm").onsubmit = function (e) {
      e.preventDefault(); var err = $("gErr"); err.textContent = "Signing in…";
      fetch(URL_ + "/functions/v1/chausima-login", { method: "POST", headers: { "content-type": "application/json", apikey: KEY_, Authorization: "Bearer " + KEY_ },
        body: JSON.stringify({ email: $("gEm").value.trim(), password: $("gPw").value }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) { err.textContent = j.reason || "Couldn't sign in."; $("gPw").value = ""; return; }
          return sb.auth.verifyOtp({ token_hash: j.token_hash, type: "email" }).then(function (r) { if (r.error) { err.textContent = "Couldn't finish signing in. Try again."; return; } location.reload(); });
        }).catch(function () { err.textContent = "Can't reach the server. Check your connection."; });
    };
  }
  function call(payload, onDelta, onEvent) {
    payload.stream = true;
    return sb.auth.getSession().then(function (s) {
      var tok = s.data && s.data.session && s.data.session.access_token;
      if (!tok) return { error: "signin" };
      return fetch(URL_ + "/functions/v1/hwchat", { method: "POST", headers: { Authorization: "Bearer " + tok, apikey: KEY_, "content-type": "application/json" }, body: JSON.stringify(payload) }).then(function (r) {
        var ct = r.headers.get("content-type") || "";
        if (ct.indexOf("text/event-stream") < 0 || !r.body || !window.TextDecoder) return r.json().catch(function () { return { error: "Something went wrong - try again." }; });
        var reader = r.body.getReader(), dec = new TextDecoder(), buf = "", done = null;
        function pump() {
          return reader.read().then(function (x) {
            if (x.done) return done || { error: "The answer stopped early - try again." };
            buf += dec.decode(x.value, { stream: true });
            var i;
            while ((i = buf.indexOf("\n\n")) >= 0) {
              var ev = buf.slice(0, i); buf = buf.slice(i + 2);
              ev.split("\n").forEach(function (line) {
                if (line.indexOf("data:") !== 0) return;
                try { var o = JSON.parse(line.slice(5)); if (o.t) onDelta(o.t); else if (o.done) done = o; else if (onEvent) onEvent(o); } catch (e) {}
              });
            }
            return pump();
          });
        }
        return pump();
      });
    }).catch(function () { return { error: "Couldn't reach HWLAI - check your connection and try again." }; });
  }
  function ask(q) {
    if (busy) return;
    if (!signedIn) { gate(); return; }
    busy = true;
    $("home").hidden = true; $("logo").hidden = false; $("followBox").hidden = false;
    try { history.replaceState(null, "", "#q=" + encodeURIComponent(q.slice(0, 500))); } catch (e) {}
    document.title = q.slice(0, 60) + " - HWLAI";
    var box = document.createElement("section"); box.className = "qa";
    box.innerHTML = '<h2></h2><div class="srcs" hidden></div><div class="status"><span class="dot" aria-hidden="true"></span><span>Searching the web…</span></div><div class="body" aria-live="polite"></div><div class="meta" hidden></div>';
    box.querySelector("h2").textContent = q;
    $("log").appendChild(box);
    box.scrollIntoView({ behavior: "smooth", block: "start" });
    var st = box.querySelector(".status span"), body = box.querySelector(".body"), srcBox = box.querySelector(".srcs");
    var live = "", sources = null, timer = 0;
    function showSources(s) { sources = s; srcBox.hidden = !s || !s.length; if (s && s.length) srcBox.innerHTML = sourcesHtml(s).replace(/^<div class="srcs"[^>]*>|<\/div>$/g, ""); }
    call({ action: "send", thread: thread, text: q, model: "hwlai", files: [] }, function (t) {
      live += t; box.querySelector(".status").hidden = true;
      if (!timer) timer = setTimeout(function () { timer = 0; body.innerHTML = cites(md(live), sources); }, 60);
    }, function (o) {
      if (o.s === "searching") st.textContent = "Searching the web…";
      if (o.s === "reading") st.textContent = "Reading " + o.n + " page" + (o.n === 1 ? "" : "s") + "…";
      if (o.sources) { showSources(o.sources); st.textContent = "Writing an answer from " + o.sources.length + " source" + (o.sources.length === 1 ? "" : "s") + "…"; }
    }).then(function (d) {
      if (timer) { clearTimeout(timer); timer = 0; }
      busy = false; box.querySelector(".status").hidden = true;
      if (d && d.error === "signin") { gate(); return; }
      if (!d || d.error) { body.innerHTML = '<p class="err">' + esc((d && d.error) || "Something went wrong - try again.") + "</p>"; return; }
      if (d.thread) thread = d.thread;
      if (d.sources) showSources(d.sources);
      body.innerHTML = cites(md(d.reply || live), sources);
      var meta = box.querySelector(".meta"); meta.hidden = false;
      meta.innerHTML = (d.removed && d.removed.length ? "<span>🔒 Took out " + esc(d.removed.join(", ")) + " before searching</span>" : "") +
        (d.note ? "<span>" + esc(d.note) + "</span>" : "") +
        (thread ? '<a href="https://ai.civilinitiatives.org/?c=' + encodeURIComponent(thread) + '">Continue in Launchpad AI ↗</a>' : "");
      $("qMore").focus();
    });
  }
  /* signed in? then answer a question passed in the address (#q=...) */
  (sb ? sb.auth.getSession() : Promise.resolve({ data: {} })).then(function (s) {
    signedIn = !!(s.data && s.data.session);
    var q = "";
    try { q = new URLSearchParams(location.hash.slice(1)).get("q") || new URLSearchParams(location.search).get("q") || ""; } catch (e) {}
    if (!signedIn) { if (q) gate(); return; }
    $("openLai").hidden = false; $("openLp").hidden = false;
    if (!q) { try { q = sessionStorage.getItem("hwlai.q") || ""; sessionStorage.removeItem("hwlai.q"); } catch (e) {} }
    if (q.trim()) ask(q.trim().slice(0, 2000)); else $("qHome").focus();
  });
})();
</script>
